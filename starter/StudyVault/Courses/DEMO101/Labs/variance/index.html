<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variance lab</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.55 system-ui, sans-serif;
      color: #172e35;
      background: #f5f7f4;
      --primary: #176759;
      --strong: #944414;
      --quiet: #465d61;
      --grid: #dce6e2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1080px, 100%); margin: auto; padding: clamp(16px, 4vw, 44px); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.055em; line-height: 1.1; }
    header p, .detail { color: var(--quiet); }
    header p { margin-top: .6rem; }
    .controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem;
      margin: 1.4rem 0; padding: .8rem 0;
      border-block: 1px solid #bdd0c9;
    }
    label { font-weight: 650; }
    output { font-variant-numeric: tabular-nums; min-width: 3.3ch; color: var(--primary); font-weight: 750; }
    input { flex: 1 1 8rem; min-width: 0; accent-color: var(--primary); }
    button {
      border: 1px solid var(--primary); border-radius: 5px; padding: .35rem .8rem;
      color: white; background: var(--primary); font: inherit; cursor: pointer;
    }
    .plots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    article { min-width: 0; border: 1px solid var(--grid); border-radius: 8px; padding: 1rem; background: #fff; }
    h2 { font-size: 1.1rem; line-height: 1.3; }
    .detail { font-size: .875rem; margin-top: .15rem; }
    svg { display: block; width: 100%; height: auto; margin-top: .4rem; overflow: visible; }
    .grid { stroke: var(--grid); }
    .axis { stroke: #7b9291; }
    .axis-label { fill: var(--quiet); font-size: 12px; }
    .reference { stroke: var(--strong); stroke-width: 2; stroke-dasharray: 6 4; }
    .observation { fill: var(--primary); fill-opacity: .8; cursor: crosshair; }
    .observation.active { fill: var(--strong); fill-opacity: 1; stroke: #fff; stroke-width: 1.5; }
    .observation:focus-visible { outline: 2px solid var(--strong); }
    #readout { min-height: 1.6em; margin-top: .75rem; color: var(--quiet); font-size: .9rem; font-variant-numeric: tabular-nums; }
    @media (max-width: 660px) { .plots { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Variance lab</h1>
      <p>Change the spread, then compare the observations with their OLS residuals.</p>
    </header>
    <div class="controls">
      <label for="growth">Spread growth κ</label>
      <input id="growth" type="range" min="0" max="2.4" step="0.01" value="0">
      <output id="growth-value" for="growth">0.00</output>
      <button type="button" id="animate">Animate</button>
    </div>
    <div class="plots">
      <article>
        <h2>Observations</h2>
        <p class="detail">Response vs. predictor · dashed line is the OLS fit.</p>
        <svg id="observations" role="group" aria-label="Observations and OLS fit" viewBox="0 0 390 252"></svg>
      </article>
      <article>
        <h2>Residuals</h2>
        <p class="detail">Residual vs. fitted value · dashed line is zero.</p>
        <svg id="residuals" role="group" aria-label="Residuals against fitted values" viewBox="0 0 390 252"></svg>
      </article>
    </div>
    <p id="readout">Hover over a point to find the same observation on both plots.</p>
    <noscript><p>Enable JavaScript for the interactive plots. The Lab note includes a static comparison.</p></noscript>
  </main>
  <script>
    const disturbance = [
      -0.8, 1.1, -0.2, 0.6, -1.4, 0.3, 0.8, -0.9, 0.1, -1.1, 1.4, -0.3,
      0.5, -1.5, 1.0, -0.6, 0.2, 1.3, -0.9, 0.6, -1.2, 0.4, 1.1, -0.4,
      0.1, -1.1, 1.5, -0.8, 0.7, -0.6,
    ];
    const x = disturbance.map((_, index) => index / (disturbance.length - 1));
    const mean = values => values.reduce((sum, value) => sum + value, 0) / values.length;
    const xMean = mean(x);
    const xSquares = x.reduce((sum, value) => sum + (value - xMean) ** 2, 0);
    const growthInput = document.querySelector("#growth");
    const growthValue = document.querySelector("#growth-value");
    const animateButton = document.querySelector("#animate");
    const readout = document.querySelector("#readout");
    const defaultReadout = readout.textContent;
    const maxGrowth = Number(growthInput.max);

    function estimate(kappa) {
      const response = x.map((value, index) => 1 + 2 * value + (0.24 + kappa * value) * disturbance[index]);
      const responseMean = mean(response);
      const slope = x.reduce((sum, value, index) => sum + (value - xMean) * (response[index] - responseMean), 0) / xSquares;
      const intercept = responseMean - slope * xMean;
      const fitted = x.map(value => intercept + slope * value);
      const residual = response.map((value, index) => value - fitted[index]);
      return { response, fitted, residual };
    }

    function svgElement(name, attributes, label) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      if (label !== undefined) element.textContent = label;
      return element;
    }

    function plot(id, xTicks, yTicks, axisLabel) {
      const svg = document.querySelector(id);
      const left = 36, right = 375, top = 16, bottom = 210;
      const coordinate = (value, ticks, start, end) =>
        start + (value - ticks[0]) / (ticks[ticks.length - 1] - ticks[0]) * (end - start);
      const xAt = value => coordinate(value, xTicks, left + 8, right - 8);
      const yAt = value => coordinate(value, yTicks, bottom - 6, top + 6);
      const line = (x1, y1, x2, y2, className) => svgElement("line", { x1, y1, x2, y2, class: className });

      for (const tick of yTicks) {
        const y = yAt(tick);
        svg.append(line(left, y, right, y, "grid"));
        svg.append(svgElement("text", { x: left - 7, y: y + 4, "text-anchor": "end", class: "axis-label" }, tick));
      }
      for (const tick of xTicks) {
        const xx = xAt(tick);
        svg.append(line(xx, bottom, xx, top, "grid"));
        svg.append(svgElement("text", { x: xx, y: bottom + 17, "text-anchor": "middle", class: "axis-label" }, tick));
      }
      svg.append(line(left, top, left, bottom, "axis"), line(left, bottom, right, bottom, "axis"));
      svg.append(svgElement("text", {
        x: (left + right) / 2, y: 247, "text-anchor": "middle", class: "axis-label",
      }, axisLabel));
      const reference = line(left, bottom, right, bottom, "reference");
      svg.append(reference);

      const points = x.map((_, index) => {
        const point = svgElement("circle", {
          r: 4.1, class: "observation", tabindex: 0, role: "img", "aria-label": `Observation ${index + 1}`,
        });
        point.addEventListener("pointerenter", () => highlight(index));
        point.addEventListener("pointerleave", () => highlight(null));
        point.addEventListener("focus", () => highlight(index));
        point.addEventListener("blur", () => highlight(null));
        svg.append(point);
        return point;
      });

      return {
        points,
        draw(horizontal, vertical, lineStart, lineEnd) {
          points.forEach((point, index) => {
            point.setAttribute("cx", xAt(horizontal[index]));
            point.setAttribute("cy", yAt(vertical[index]));
          });
          reference.setAttribute("x1", xAt(lineStart[0]));
          reference.setAttribute("y1", yAt(lineStart[1]));
          reference.setAttribute("x2", xAt(lineEnd[0]));
          reference.setAttribute("y2", yAt(lineEnd[1]));
        },
      };
    }

    const endpointModels = [estimate(0), estimate(maxGrowth)];
    function ticksFor(key, step) {
      const values = endpointModels.flatMap(model => model[key]);
      const low = Math.floor(Math.min(...values) / step);
      const high = Math.ceil(Math.max(...values) / step);
      return Array.from({ length: high - low + 1 }, (_, index) => (low + index) * step);
    }

    const fittedTicks = ticksFor("fitted", 0.5);
    const observations = plot("#observations", [0, 0.25, 0.5, 0.75, 1], ticksFor("response", 2), "Predictor x");
    const residuals = plot("#residuals", fittedTicks, ticksFor("residual", 1), "Fitted value ŷ");
    let currentModel;
    let highlighted = null;
    let frame = null;

    function updateReadout() {
      if (highlighted === null) {
        readout.textContent = defaultReadout;
        return;
      }
      const i = highlighted;
      readout.textContent = `Observation ${i + 1} · x = ${x[i].toFixed(2)} · y = ${currentModel.response[i].toFixed(2)} · ŷ = ${currentModel.fitted[i].toFixed(2)} · residual = ${currentModel.residual[i].toFixed(2)}`;
    }

    function highlight(index) {
      for (const chart of [observations, residuals]) {
        if (highlighted !== null) chart.points[highlighted].classList.remove("active");
        if (index !== null) chart.points[index].classList.add("active");
      }
      highlighted = index;
      updateReadout();
    }

    function update() {
      const kappa = Number(growthInput.value);
      growthValue.textContent = kappa.toFixed(2);
      currentModel = estimate(kappa);
      const { response, fitted, residual } = currentModel;
      observations.draw(x, response, [0, fitted[0]], [1, fitted[fitted.length - 1]]);
      residuals.draw(fitted, residual, [fittedTicks[0], 0], [fittedTicks[fittedTicks.length - 1], 0]);
      updateReadout();
    }

    function stopAnimation() {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      animateButton.textContent = "Animate";
    }

    growthInput.addEventListener("input", () => {
      stopAnimation();
      update();
    });
    animateButton.addEventListener("click", () => {
      if (frame !== null) {
        stopAnimation();
        return;
      }
      const duration = 8000;
      const phase = Math.acos(1 - 2 * Number(growthInput.value) / maxGrowth);
      let start;
      function animate(now) {
        start ??= now;
        const angle = phase + (now - start) * 2 * Math.PI / duration;
        growthInput.value = (maxGrowth * (1 - Math.cos(angle)) / 2).toFixed(2);
        update();
        frame = requestAnimationFrame(animate);
      }
      animateButton.textContent = "Pause";
      frame = requestAnimationFrame(animate);
    });
    update();
  </script>
</body>
</html>
